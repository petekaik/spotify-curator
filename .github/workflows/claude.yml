# Claude Code on demand: acts on "@claude" in issues and PR comments (e.g. "@claude review this").
# No automatic review on every push, and a smaller model, to keep Claude usage down.
# Inactive until a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret exists and the Claude GitHub App is installed
# (run /install-github-app in Claude Code to set up both).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  mention:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude'))
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-haiku-5-5
