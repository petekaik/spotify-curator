name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran (e.g. `spotify-curator playlist create … --dry-run`) and its output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit SHA
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [CLI on macOS, CLI on Linux, Docker / Hermes]
