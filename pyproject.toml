[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-curator"
version = "0.2.0"
description = "Finds small and emerging artists that match your Spotify taste and builds playlists from them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Petteri Kaikkonen" }]
keywords = ["spotify", "music-discovery", "playlist", "last-fm", "llm-agent"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "spotipy>=2.25.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "musicbrainzngs>=0.7.1",
    "feedparser>=6.0.12",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "apscheduler>=3.10.0",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "vcrpy>=6.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/petekaik/spotify-curator"
Changelog = "https://github.com/petekaik/spotify-curator/blob/main/CHANGELOG.md"
Portfolio = "https://gitpages.morgeweb.com/"

[project.scripts]
spotify-curator = "src.cli.main:main"
spotify-curator-mcp = "src.mcp_server:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # formatter owns line length; long strings/URLs are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # nested patch() blocks read better in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80  # measured 84% on 2026-11-26; raise as tests grow
show_missing = false
skip_covered = true
